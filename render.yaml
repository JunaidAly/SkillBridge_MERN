# Render Blueprint for SkillBridge MERN Application
# This file defines all services for deployment on Render
# Deploy all services at once: https://dashboard.render.com/select-repo

services:
  # Backend Service (Node.js/Express)
  - type: web
    name: skillbridge-backend
    runtime: node
    region: oregon # Change to your preferred region: oregon, frankfurt, singapore, ohio
    plan: free # Options: free, starter ($7), standard ($25)
    branch: main # Change to your deployment branch if different
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api
    # Note: Using native Node runtime instead of Docker for simpler deployment
    # To use Docker instead, uncomment the line below and comment out runtime/buildCommand/startCommand
    # dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set this manually in Render dashboard for security
      - key: JWT_SECRET
        generateValue: true # Render will auto-generate a secure secret
      - key: RECOMMENDATION_SERVICE_URL
        fromService:
          type: web
          name: skillbridge-recommendation-service
          property: host
      - key: RECOMMENDATION_SERVICE_API_KEY
        generateValue: true # Render will auto-generate a secure secret
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set this manually in Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # Set this manually in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # Set this manually in Render dashboard
      - key: EMAIL_HOST
        sync: false # Set this manually in Render dashboard
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false # Set this manually in Render dashboard
      - key: EMAIL_PASS
        sync: false # Set this manually in Render dashboard

  # Recommendation Service (Python/FastAPI)
  - type: web
    name: skillbridge-recommendation-service
    runtime: python
    region: oregon # Use same region as backend
    plan: free
    branch: main
    rootDir: recommendation-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Note: Using native Python runtime instead of Docker for simpler deployment
    # To use Docker instead, uncomment the line below and comment out runtime/buildCommand/startCommand
    # dockerfilePath: ./recommendation-service/Dockerfile
    envVars:
      - key: MONGODB_URI
        sync: false # Set this manually in Render dashboard (same as backend)
      - key: MONGODB_DB_NAME
        value: skillbridge
      - key: SERVICE_PORT
        value: 8001
      - key: SERVICE_HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: API_KEY
        sync: false # Set this manually - must match RECOMMENDATION_SERVICE_API_KEY in backend
      - key: ALLOWED_ORIGINS
        sync: false # Set this manually after deploying (comma-separated: frontend_url,backend_url)
      - key: MODEL_STORAGE_PATH
        value: /app/models

# Notes:
# 1. Environment variables marked with "sync: false" must be set manually in Render dashboard
# 2. Variables with "generateValue: true" will be auto-generated by Render
# 3. After initial deployment, update ALLOWED_ORIGINS in recommendation service with actual URLs
# 4. For production, consider upgrading to paid plans for better performance
# 5. Deploy this blueprint at: https://dashboard.render.com/select-repo
